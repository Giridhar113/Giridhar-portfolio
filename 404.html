<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - GRP_</title>
  <meta name="description" content="The requested portfolio page could not be found.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <style>
    :root { --bg:#080c14; --card:#0f1a2e; --text:#dce8f5; --muted:#8a9bb5; --accent:#38c9a0; --border:rgba(56,201,160,.16); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; display:grid; place-items:center; font-family:Arial,sans-serif; background:var(--bg); color:var(--text); padding:24px; }
    .panel { width:min(720px,100%); border:1px solid var(--border); background:var(--card); border-radius:10px; padding:34px; }
    .logo { color:var(--accent); font:14px Consolas,monospace; margin-bottom:22px; }
    h1 { font-size:clamp(40px,8vw,76px); line-height:.95; margin-bottom:16px; }
    p { color:var(--muted); line-height:1.7; margin-bottom:24px; }
    a { display:inline-block; color:#04110d; background:var(--accent); padding:12px 18px; border-radius:6px; text-decoration:none; font:12px Consolas,monospace; letter-spacing:.08em; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="logo">GRP_ / 404</div>
    <h1>Page not found</h1>
    <p>This page is not available, but the portfolio, resume, projects, and contact section are ready.</p>
    <a href="index.html">Back to portfolio</a>
  </main>
</body>
</html>
